[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
wf-rom = { path = "crates/wf-rom" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
png = "0.17"
sha1 = { version = "0.10", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.release-wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# tests decode a lot of LZ data; keep them fast
[profile.test]
opt-level = 2

[profile.dev]
opt-level = 1
