# fly.io: the signaling server only (TURN on fly.io needs a dedicated IPv4 and UDP on `fly-global-services`; use
# a TURN provider or the VPS recipe for the relay, see README.md). From engine/:
#   fly launch --no-deploy --copy-config --config deploy/netplay/fly.toml --dockerfile deploy/netplay/Dockerfile
#   fly secrets set WF_TURN_SECRET=... WF_SIGNAL_KEY=... --config deploy/netplay/fly.toml
#   fly deploy --config deploy/netplay/fly.toml --dockerfile deploy/netplay/Dockerfile
# Players then use wss://<app>.fly.dev (fly terminates TLS).
app = "wf-signal-CHANGE-ME"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  WF_SIGNAL_ADDR = "0.0.0.0:3536"
  WF_REQUIRE_TOKEN = "1"
  # with a TURN provider that uses the TURN REST API shared secret (coturn-compatible); otherwise leave TURN unset
  # and give players the provider's ICE JSON (--net-ice / ?ice=)
  # WF_TURN_URLS = "turn:turn.example.com:3478?transport=udp,turns:turn.example.com:5349?transport=tcp"

[http_service]
  internal_port = 3536
  force_https = true
  # signaling connections are long-lived WebSockets: keep one machine up
  auto_stop_machines = "off"
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 1500
    hard_limit = 2000

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
