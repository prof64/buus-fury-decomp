# coturn for Buu's Fury online play. The secret, realm, public IP and certificate come from docker-compose.yml
# (command line), so this file holds no secrets.
listening-port=3478
# turns:// (TURN over TLS, for networks that block UDP): uncomment and give coturn a certificate for the realm's
# domain (cert=/path/fullchain.pem, pkey=/path/privkey.pem), see README.md
# tls-listening-port=5349
no-tls
no-dtls
# relay ports (open these UDP ports in the firewall; ~2 per player in a relayed match)
min-port=49160
max-port=49200
fingerprint
# TURN REST API: wf-signal mints time-limited username/password pairs from the shared secret at /ice
use-auth-secret
# no relaying into this machine's own / private networks (an open relay is an abuse magnet)
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# limits: a match is ~130 bytes x 60 packets/s per peer; this caps one user / the whole server
user-quota=12
total-quota=400
max-bps=262144
stale-nonce=600
no-cli
log-file=stdout
simple-log
