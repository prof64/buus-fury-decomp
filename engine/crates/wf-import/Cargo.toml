edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
wf-core = { path = "../wf-core" }
wf-script = { path = "../wf-script" }
wf-script-core = { path = "../wf-script-core" }
wf-script-rhai = { path = "../wf-script-rhai" }
serde.workspace = true
serde_json.workspace = true
miniz_oxide = "0.8"

[dev-dependencies]
wf-rom.workspace = true
wf-extract = { path = "../wf-extract" }
wf-ui = { path = "../wf-ui" }
